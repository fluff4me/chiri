name: CI

on:
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        
      - name: Build
        run: pnpm run build
      
      - name: Clean
        run: |
          pnpm install del-cli
          cat .npmignore | xargs -I {} npx del-cli '{}'
          rm -rf node_modules
          rm -f .gitignore
          mkdir -p build
          rsync -av --exclude='.git' ./ build/
          pnpm uninstall del-cli
       
      - name: Deploy
        uses: s0/git-publish-subdir-action@v2.5.1
        env:
          REPO: self
          BRANCH: package
          FOLDER: build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Deploy {sha}:\n{msg}"
